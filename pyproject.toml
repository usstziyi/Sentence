[project]
name = "sentence"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "usstziyi", email = "007lookworld@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.1.0",
    "torch>=2.11.0",
]

[project.scripts]
sentence = "sentence:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
